services:
  server:
    build:
      context: .
      target: development
    ports:
      - 5050:8080 # HTTP
      - 5051:8081 # HTTPS
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER=true
      - DOTNET_WATCH_RESTART_ON_RUDE_EDIT=true
      - ConnectionStrings__Postgres=${POSTGRES_CONNECTION}
      - ConnectionStrings__Redis=${REDIS_CONNECTION}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - JwtOptions__Secret=${JWT_SECRET}
      - JwtOptions__Issuers=${JWT_ISSUERS}
      - JwtOptions__Audiences=${JWT_AUDIENCES}
      - JwtOptions__ExpirationTimeInMinutes=${JWT_EXPIRATION_TIME_IN_MINUTES}
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    volumes:
      - ${HOME}/.aspnet/https:/https:ro
      # Mount source code for hot reload
      - ./src:/source/src
      - ./db:/source/db
      # Exclude build artifacts with anonymous volumes
      - /source/src/Serene.API/bin/
      - /source/src/Serene.API/obj/
      - /root/.nuget/packages
    develop:
      watch:
        # Rebuild on any C# file change
        - path: ./src/**/*.cs
          action: rebuild
          
        # Rebuild when any .csproj changes
        - path: ./src/**/*.csproj
          action: rebuild
          
        # Rebuild when appsettings changes
        - path: ./src/**/appsettings*.json
          action: rebuild
          
        # Rebuild when Dockerfile changes
        - path: ./Dockerfile
          action: rebuild

  postgres-db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=serene
      - PGDATA=/var/lib/postgresql/data/pgdata
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-db:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data: