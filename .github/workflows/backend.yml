name: Backend CI

on:
  push:
    branches: [ master ]
    paths: ['server/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [ master ]
    paths: ['server/**', '.github/workflows/backend.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore server/Serene.sln

      - name: Build
        run: dotnet build server/Serene.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test server/Serene.sln --no-build --configuration Release --verbosity normal
