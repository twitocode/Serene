name: Frontend CI

on:
  push:
    branches: [ master ]
    paths: ['client/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [ master ]
    paths: ['client/**', '.github/workflows/frontend.yml']

permissions:
  contents: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: client

      - name: Lint
        run: bun run lint
        working-directory: client

      - name: Apply lint fixes
        if: failure()
        run: bun run check
        working-directory: client

      - name: Commit fixes
        if: failure()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix linting issues [skip ci]"
          branch: ${{ github.head_ref }}

      - name: Build
        run: bun run build
        working-directory: client

