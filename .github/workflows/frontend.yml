name: Frontend CI

on:
  push:
    branches: [ main ]
    paths: ['client/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [ main ]
    paths: ['client/**', '.github/workflows/frontend.yml']

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: client

      - name: Lint
        run: bun run lint
        working-directory: client

      - name: Build
        run: bun run build
        working-directory: client
