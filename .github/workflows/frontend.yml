name: Frontend CI

on:
  push:
    branches: [ master ]
    paths: ['client/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [ master ]
    paths: ['client/**', '.github/workflows/frontend.yml']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      INTERNAL_SERVER_URL: https://api.example.com
      NEXT_PUBLIC_SERVER_URL: https://api.example.com
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: client

      - name: Run unit tests
        run: bun run test
        working-directory: client

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium
        working-directory: client

      - name: Run E2E tests
        run: bun run test:e2e
        working-directory: client

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

      - name: Lint
        run: bun run lint
        working-directory: client

      - name: Apply lint fixes
        if: failure()
        run: bun run check
        working-directory: client

      - name: Commit fixes
        if: failure()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix linting issues [skip ci]"
          branch: ${{ github.head_ref }}

      - name: Build
        run: bun run build
        working-directory: client

